<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | Master Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #020408; color: #e2e8f0; }
        .dark-card { background: #0a0f1d; border: 1px solid #1e2533; border-radius: 24px; transition: all 0.3s ease; }
        .user-detail { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out; }
        .user-card.active .user-detail { max-height: 3000px; padding-top: 1.5rem; }
        .user-card.active { border-color: #00f2ff; box-shadow: 0 0 30px rgba(0, 242, 255, 0.1); }
        input[type="number"]::-webkit-inner-spin-button { display: none; }
    </style>
</head>
<body class="p-6 pb-20">

    <div id="admin-login" class="max-w-md mx-auto mt-20 text-center">
        <h1 class="text-4xl font-black italic mb-8 uppercase tracking-tighter text-cyan-400">Orbit Admin<span class="text-white">.</span></h1>
        <input type="password" id="adminPass" placeholder="Mot de passe" class="w-full bg-[#0a0f1d] border border-slate-700 rounded-2xl px-6 py-4 text-center font-bold mb-4 focus:border-cyan-500 outline-none">
        <button onclick="loginAdmin()" class="w-full bg-[#00f2ff] text-[#020408] py-4 rounded-2xl font-black uppercase shadow-lg shadow-cyan-500/20">Prendre le contrôle</button>
    </div>

    <div id="admin-dashboard" class="hidden max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-black italic uppercase">Contrôle Total</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Gérer les utilisateurs et données</p>
            </div>
            <button onclick="location.reload()" class="bg-white/5 px-4 py-2 rounded-xl text-[10px] font-bold text-slate-400 uppercase">Se déconnecter</button>
        </div>

        <div id="usersList" class="space-y-6">
            <p class="text-center text-slate-600 animate-pulse uppercase text-xs font-bold italic">Accès aux serveurs Orbit...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCR_Z6UcQRD-xV86us9ZFXe3yGOivzMm0Q",
            authDomain: "budget-18-ans.firebaseapp.com",
            projectId: "budget-18-ans",
            storageBucket: "budget-18-ans.firebasestorage.app",
            messagingSenderId: "171238611115",
            appId: "1:171238611115:web:a54e2b06daa0a22294bfee"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const MASTER_ADMIN_KEY = "Antonio76"; 

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === MASTER_ADMIN_KEY) {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadUsers();
            } else { alert("Accès refusé."); }
        }

        function loadUsers() {
            db.collection("users").onSnapshot((snapshot) => {
                const list = document.getElementById('usersList');
                list.innerHTML = "";

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const userId = doc.id;
                    const savings = data.savings || 0;
                    const pass = data.password || "N/A";
                    const friends = data.friends || {};

                    const card = document.createElement('div');
                    card.className = "user-card dark-card p-6 cursor-pointer";
                    card.setAttribute('data-user', userId);
                    card.onclick = (e) => {
                        if (["BUTTON", "INPUT"].includes(e.target.tagName)) return;
                        card.classList.toggle('active');
                    };

                    let friendsHTML = "";
                    for (const [fName, fData] of Object.entries(friends)) {
                        friendsHTML += `
                            <div class="bg-[#020408] rounded-xl p-4 mb-3 border border-slate-800">
                                <div class="flex justify-between items-center mb-3">
                                    <input type="text" value="${fName}" onchange="renameFolder('${userId}', '${fName}', this.value)" class="text-cyan-400 bg-transparent font-black text-xs uppercase italic focus:border-b border-cyan-500 outline-none">
                                    <button onclick="deleteFolder('${userId}', '${fName}')" class="text-red-900 text-[10px] font-black uppercase">Suppr.</button>
                                </div>
                                <div class="space-y-2">
                                    ${fData.items.map((it, idx) => `
                                        <div class="flex gap-2">
                                            <input type="text" value="${it.name}" onchange="updateDetail('${userId}', '${fName}', ${idx}, 'name', this.value)" class="flex-1 bg-white/5 rounded px-2 py-1 text-[10px] text-slate-300">
                                            <input type="number" value="${it.cost}" onchange="updateDetail('${userId}', '${fName}', ${idx}, 'cost', this.value)" class="w-16 bg-white/5 rounded px-2 py-1 text-[10px] text-cyan-500 font-bold">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <h2 class="text-xl font-black uppercase tracking-tight">${userId}</h2>
                                    <span class="text-[9px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 font-mono">PWD: ${pass}</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-slate-500 text-[10px] uppercase font-bold">Solde actuel:</span>
                                    <input type="number" value="${savings}" onchange="updateGlobalSavings('${userId}', this.value)" class="bg-transparent text-cyan-400 font-black text-sm w-24 border-b border-transparent focus:border-cyan-500 outline-none">
                                </div>
                            </div>
                            <button onclick="deleteUser('${userId}')" class="bg-red-500/10 text-red-500 px-3 py-2 rounded-lg text-[9px] font-black uppercase hover:bg-red-500 hover:text-white transition">X</button>
                        </div>
                        
                        <div class="user-detail">
                            <hr class="border-slate-800 my-4">
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest italic">Gestion des dossiers</h3>
                                <button onclick="resetPassword('${userId}')" class="text-[8px] bg-white/5 px-2 py-1 rounded text-slate-400 uppercase font-bold">Changer Pass</button>
                            </div>
                            ${friendsHTML || '<p class="text-[10px] text-slate-600 italic">Aucun dossier créé.</p>'}
                        </div>
                    `;
                    list.appendChild(card);
                });
            });
        }

        // --- FONCTIONS DE MODIFICATION ---

        async function updateGlobalSavings(id, val) {
            await db.collection("users").doc(id).update({ savings: parseFloat(val) });
        }

        async function resetPassword(id) {
            const newPass = prompt("Nouveau mot de passe pour " + id + " :");
            if(newPass) await db.collection("users").doc(id).update({ password: newPass });
        }

        async function updateDetail(userId, fName, itemIdx, field, val) {
            const docRef = db.collection("users").doc(userId);
            const doc = await docRef.get();
            let friends = doc.data().friends;
            friends[fName].items[itemIdx][field] = field === 'cost' ? parseFloat(val) : val;
            await docRef.update({ friends });
        }

        async function renameFolder(userId, oldName, newName) {
            if(!newName || oldName === newName) return;
            const docRef = db.collection("users").doc(userId);
            const doc = await docRef.get();
            let friends = doc.data().friends;
            friends[newName] = friends[oldName];
            delete friends[oldName];
            await docRef.update({ friends });
        }

        async function deleteFolder(userId, fName) {
            if(!confirm("Supprimer le dossier " + fName + " ?")) return;
            const docRef = db.collection("users").doc(userId);
            const doc = await docRef.get();
            let friends = doc.data().friends;
            delete friends[fName];
            await docRef.update({ friends });
        }

        async function deleteUser(id) {
            if(confirm(`⚠️ SUPPRIMER DÉFINITIVEMENT LE COMPTE DE ${id.toUpperCase()} ?`)) {
                await db.collection("users").doc(id).delete();
            }
        }
    </script>
    <footer class="mt-20 mb-8 text-center border-t border-slate-900 pt-8">
        <div class="flex items-center justify-center gap-2 mb-2">
            <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
            <p class="text-[9px] font-black uppercase tracking-widest text-slate-500">Serveur Live : Connecté</p>
        </div>
        <p class="text-[8px] text-slate-700 uppercase font-bold tracking-tighter italic">Orbit Admin Panel v2.4 | Antonin THOREL</p>
    </footer>
</body>
</html>
